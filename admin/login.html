<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Connexion — IPP</title>
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-card__header">
      <div class="login-card__logo">IPP</div>
      <h2 style="margin:0">Connexion administration</h2>
      <p class="text-small text-muted" style="margin:6px 0 0">Accès réservé au personnel autorisé</p>
    </div>
    <form id="login-form">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" value="superadmin2@ipp.tg" required></div>
      <div class="form-group"><label class="form-label">Mot de passe</label><input class="form-input" name="password" type="password" value="" required placeholder="••••••••"></div>
      <div id="login-error" hidden class="alert" style="background:#fee2e2;border-color:#fecaca;color:#991b1b;margin-bottom:12px;padding:10px;border:1px solid #fecaca;border-radius:6px"></div>
      <button class="btn btn--primary" type="submit" style="width:100%">Se connecter</button>
    </form>
    <div style="margin-top:16px;font-size:12px;color:var(--ipp-text-muted);text-align:center">
      Accès sécurisé via Supabase Auth<br><a href="https://ipp-rho.vercel.app/">← Retour site public</a>
    </div>
  </div>
</div>
<script type="module">
import { authService } from "../js/services/authService.js";
// Si déjà connecté, redirige (non bloquant, IIFE)
(async()=>{
  try{
    const user = await authService.getCurrentUser();
    if(user){
      const profile = await authService.getCurrentProfile();
      if(profile) location.href = "dashboard.html";
    }
  }catch(e){ console.warn("guard login:", e.message); }
})();
document.getElementById("login-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const err = document.getElementById("login-error");
  const btn = e.target.querySelector('button[type="submit"]');
  err.hidden = true; err.textContent=""; btn.disabled = true; btn.textContent = "Connexion...";
  console.log("login attempt", fd.get("email"));
  try{
    const res = await authService.login(fd.get("email"), fd.get("password"));
    console.log("login success", res.profile?.role);
    // Attend que Supabase ait persisté session (localStorage) et que getUser soit lisible
    for(let i=0;i<5;i++){
      const u = await authService.getCurrentUser().catch(()=>null);
      if(u) break;
      await new Promise(r=>setTimeout(r, 200));
    }
    location.href = "dashboard.html";
  }catch(ex){
    console.error("login failed", ex);
    err.textContent = (ex && ex.message) ? ex.message : (ex ? String(ex) : "Erreur inconnue — vérifiez console");
    err.hidden=false; btn.disabled=false; btn.textContent="Se connecter";
  }
});
</script>
</body>
</html>
